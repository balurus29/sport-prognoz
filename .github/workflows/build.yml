name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk SportPrognoz-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SportPrognoz-build${{ github.run_number }}
          path: SportPrognoz-build${{ github.run_number }}.apk
